name: CodeQL

# Scans Python (integration) + JavaScript/TypeScript (Lovelace cards).
# Runs on every push to main/dev, every PR targeting main, and once a
# week on Tuesday at 04:23 UTC to catch newly-published advisories
# against code that hasn't been touched since the last scan.
#
# workflow_dispatch exists to re-run a scan that GitHub's own
# infrastructure killed. During the 2026-08-06 Actions outage the
# CodeQL jobs were cancelled before they got a runner, and with only
# push/PR/weekly triggers the sole recovery options were an empty
# commit or a four-day wait for the Tuesday cron.
#
# NOTE: GitHub reads dispatchability from the DEFAULT branch, not the
# ref you target. This trigger does nothing until it lands on main —
# `gh workflow run CodeQL --ref dev` returns HTTP 422 until then.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL's SARIF upload step ("github/codeql-action/analyze") posts
    # results to the repo's code-scanning surface, which on PRIVATE repos
    # requires GitHub Advanced Security. Without GHAS the action runs the
    # analysis successfully (scans every file, processes findings) but fails
    # at the upload step with `Code scanning is not enabled for this
    # repository`. Skip the whole job until the repo is public. This repo
    # starts private and flips public at the 1.0.0 release — when it does,
    # the gate opens automatically with no edit here.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - 'custom_components/badegewaesser_austria/www/**/*.js'
              - 'node_modules/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
