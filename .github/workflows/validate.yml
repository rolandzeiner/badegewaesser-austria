name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  no-dev-fixture:
    # `_dev_fixture.py` is a gitignored, dev-only hook that injects a
    # recorded payload during local development. This integration needs one:
    # `TGESPERRT` is "0" on all 260 sites and `SPERRGRUND` is empty
    # everywhere, so the closure banner and the `problem` binary_sensor have
    # no live data to render against. The fixture must never enter the repo —
    # gitignore covers accidental staging, this guards against `git add -f`
    # or the rule being deleted. Loud, fast, first job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify _dev_fixture.py is not committed
        run: |
          if [ -f custom_components/badegewaesser_austria/_dev_fixture.py ]; then
            echo "::error::custom_components/badegewaesser_austria/_dev_fixture.py must never be committed (dev-only hook)."
            exit 1
          fi

  compile-floor-python:
    # Every other job runs the CI interpreter (3.14). `hacs.json` promises
    # Home Assistant >= 2025.6.0, whose REQUIRED_PYTHON_VER is (3, 13, 2) —
    # so without this job the whole gate is structurally blind to syntax that
    # parses on 3.14 and not on the floor.
    #
    # `ruff check` covers this too, since target-version is pinned to the
    # floor in pyproject.toml. This job is the independent backstop: it asks
    # the real interpreter, so it also covers syntax no linter rule models.
    # wiener-linien v1.7.1 shipped PEP 758 `except A, B:` that way and failed
    # to import for every user below 3.14, with CI fully green.
    #
    # Bump `python-version` only together with `homeassistant` in `hacs.json`
    # and `target-version` in `pyproject.toml`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Byte-compile the shipped package on the oldest supported Python
        run: python -m compileall -q custom_components/badegewaesser_austria

  validate-hacs:
    # The HACS validate action expects a PUBLIC repository. Its internal
    # manifest / hacs.json fetches use unauthenticated GitHub API calls,
    # which silently return `None` from a private repo; that surfaces as the
    # thoroughly misleading pair
    #   <Validation hacsjson> failed: The repository has an invalid 'hacs.json'
    #   <Validation integration_manifest> failed: expected a dictionary. Got None
    # neither of which is true — both files are valid and were read fine by
    # every other job in this workflow. Measured on this repo's first CI run,
    # 2026-09-22, and already documented the same way in
    # evn-smartmeter-austria, which is private permanently.
    #
    # This repo starts private and flips public at the 1.0.0 release, so the
    # guard opens the gate automatically with no edit here.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Login to ghcr.io
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pinned to 3.14 — PHACC 0.13.365 wraps HA core 2026.9.x, which
          # requires Python >=3.14.2. This is the RUNTIME axis; the support
          # floor is 3.13 and lives in compile-floor-python above. The two
          # are deliberately different — see pyproject.toml's target-version
          # comment for what happens when they are conflated.
          python-version: "3.14"
      - name: Install uv
        # uv replaces pip for resolution + install: faster, cached, and
        # consistent with the local dev workflow (uv-built venvs).
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -r requirements_test.txt
      - name: Run Linter (Ruff)
        run: ruff check .
      - name: Check formatting (Ruff)
        # Separate from `ruff check`, which never inspects formatting.
        # Without this the formatter drifts silently until someone runs it,
        # and the catch-up lands as one unreviewable tree-wide diff.
        run: ruff format --check .
      - name: Run mypy (strict)
        run: mypy --strict --ignore-missing-imports custom_components/badegewaesser_austria
      - name: Run tests
        run: pytest tests/ -v
      - name: Per-module coverage floor
        # `--cov-fail-under` in pytest.ini is a single number over the whole
        # package. The Silver `test-coverage` rule is per module, and the two
        # are not the same gate. pytest writes coverage.json; this reads the
        # per-file numbers.
        run: python scripts/check_module_coverage.py

  validate-card:
    # Rebuilds the Lovelace card bundle from src/ and verifies the output is
    # valid JS. Catches TS errors, missing deps, and high-severity npm
    # advisories before they reach the served www/*.js file.
    #
    # No separate guard for a stray backtick inside a Lit css/html template:
    # it ends the template early, and `vp check`'s type-check reports every
    # shape of that (unknown property, syntax error), which the old regex
    # guard could not, since it ended each template at the stray backtick.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        # Installs the global vp CLI, Node and npm (from devEngines), and
        # caches npm's store. Install runs as its own step below so the
        # lockfile is enforced explicitly.
        with:
          node-version: "24"
          cache: true
          run-install: false
      - name: Install card deps
        run: vp install --frozen-lockfile
      - name: Audit production deps
        # --omit=dev keeps the gate enforceable; without it build-tooling
        # advisories (which never ship to users) flood the report and the
        # team learns to ignore failures.
        run: npm audit --omit=dev --audit-level=high
      - name: Format, lint and type-check (strict)
        # `vp check` = Oxfmt + Oxlint + tsgolint type-check (typeCheck in
        # vite.config.ts). The ONLY type-check in the pipeline: the build
        # transpiles without type-checking, so nothing else in this workflow
        # would notice a type error. Never make this step conditional.
        run: vp check
      - name: Card unit tests
        run: vp test run
      - name: Build card bundle
        run: vp build
      - name: Assert the committed bundle matches a fresh build
        # The build above regenerates www/ from src/. Any diff means the
        # committed bundle is stale — someone changed src/ and didn't
        # rebuild. Nothing else in the gate catches this:
        # tests/test_card_version.py compares manifest.json against
        # src/const.ts, i.e. source vs source, never the built artefact.
        # Shipping a stale bundle is the infinite reload-banner bug.
        run: |
          if ! git diff --exit-code -- custom_components/badegewaesser_austria/www/; then
            echo "::error::The committed card bundle differs from a fresh build."
            echo "::error::Run 'vp build' (or 'npm run build') and commit custom_components/badegewaesser_austria/www/."
            exit 1
          fi
      - name: Syntax-check bundle
        run: node -c custom_components/badegewaesser_austria/www/badegewaesser-austria-card.js
