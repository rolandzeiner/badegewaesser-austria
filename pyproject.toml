# Config home for ruff, mypy, and coverage. Pytest config stays in pytest.ini.

[tool.ruff]
# MUST track the OLDEST Python we support, not the one CI runs. `hacs.json`
# promises Home Assistant >= 2025.6.0, whose `REQUIRED_PYTHON_VER` is
# (3, 13, 2) — derived from core, not remembered:
#
#   gh api "repos/home-assistant/core/contents/homeassistant/const.py?ref=2025.6.0" \
#     --jq .content | base64 -d | grep REQUIRED_PYTHON_VER
#
# Setting this to the CI interpreter (3.14) would authorise ruff to emit
# syntax those users cannot parse and then decline to flag it. That is not
# hypothetical: wiener-linien v1.7.1 shipped PEP 758 unparenthesized
# `except A, B:` in 11 places — a hard SyntaxError below 3.14 that took the
# whole integration down while CI stayed green, because CI is 3.14-only.
#
# Raise this only together with `homeassistant` in `hacs.json` and the
# `compile-floor-python` job in `.github/workflows/validate.yml`.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # ruff's default set, kept explicit
    "I",                    # isort
    "UP",                   # pyupgrade — safe ONLY while target-version is
                            # the support floor; see the note above it
    "B",                    # flake8-bugbear
    "C4",                   # flake8-comprehensions
    "RET",                  # flake8-return
    "PTH",                  # flake8-use-pathlib
    "SIM",                  # flake8-simplify
    "LOG", "G",             # logging correctness + logging-format
    "T20",                  # no stray print()
    "ASYNC",                # flake8-async
    "DTZ",                  # naive datetimes — load-bearing here, since the
                            # whole integration reasons about sample dates
                            # and a bathing season
    "TID",                  # tidy imports
    "ISC",                  # implicit str concat
    "PIE", "RSE", "FURB", "PERF",
    "BLE",                  # broad excepts, each a reasoned noqa
    "SLF",                  # private-member access across class boundaries
    "RUF",                  # ruff-specific, incl. RUF100 dead-noqa
]
# `×` (dimensions, compression ratios) and `–` (numeric ranges) are
# deliberate typography in docstrings, not homoglyph typos.
allowed-confusables = ["×", "–"]

# Deliberately NOT selected, matching the portfolio (see
# wiener-linien-austria/pyproject.toml for the measured hit counts):
#   S (bandit), COM (commas — conflicts with `ruff format`), D (pydocstyle),
#   PL (pylint), TC, ARG, TRY, EM.

[tool.ruff.lint.per-file-ignores]
# Tests reach into coordinator and client internals on purpose — that is
# what a test for a hash short-circuit or a backoff ladder has to do.
"tests/*" = ["SLF"]
# `check_module_coverage.py` is a console script whose entire output
# contract is stdout/stderr. T201 is asking it to stop being one.
"scripts/*" = ["T201"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["custom_components/badegewaesser_austria"]

[tool.coverage.run]
source = ["custom_components/badegewaesser_austria"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_empty = true
