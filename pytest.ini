[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
# Hard cap so a hung async fixture surfaces as a failure, not as a CI job
# that idles for six hours waiting for the runner to time it out.
timeout = 15
# Unknown @pytest.mark.* names fail the run instead of warning.
# Must be the INI key, not `--strict-markers` in addopts: pytest 9 reads it
# via `config.getini("strict_markers")`, which the addopts flag does not
# reach — it silently no-ops there.
strict_markers = true
# Coverage gate: 95% floor on the package total. Coverage source is
# configured in pyproject.toml [tool.coverage.run].
#
# The package total is only half the gate. The Silver `test-coverage` rule
# is per MODULE, and one number over the whole package cannot express that —
# a single module can sit at 80% while the others carry the average past the
# floor. `--cov-report=json` writes coverage.json so
# `scripts/check_module_coverage.py` can enforce the per-module half; CI runs
# it right after pytest. Run it locally too — pytest alone will not tell you
# a module regressed.
addopts = --cov --cov-fail-under=95 --cov-report=json
markers =
    allow_deprecated_ha_api: test intentionally exercises a deprecated HA API
# Turn DeprecationWarning into a test failure. What this catches: deprecated
# *library* calls (aiohttp, PHACC, HA helpers) reached through our own code.
#
# What it does NOT catch: HA integration-API deprecations. HA reports those
# via `frame.report_usage` -> `_LOGGER.warning`, never `warnings.warn`. The
# `no_deprecated_ha_api` autouse fixture in tests/conftest.py covers that
# channel instead, on every test and for both of HA's message shapes.
#
# PendingDeprecationWarning is not caught: it is not a subclass of
# DeprecationWarning.
filterwarnings =
    error::DeprecationWarning
    # RuntimeWarning is an error for the same reason: a warning is a failure
    # everywhere else in this gate. Catches the in-control-flow cases (a sync
    # call on an async API, an invalid numeric op).
    #
    # It does NOT catch `coroutine ... was never awaited` — that warning is
    # emitted while the coroutine is finalised, and Python discards any
    # exception raised there, so promoting it to an error cannot fail a test.
    # Fix those at the source and read the warnings summary.
    error::RuntimeWarning
    ignore::DeprecationWarning:homeassistant.*
    ignore::DeprecationWarning:pytest_homeassistant_custom_component.*
    ignore::DeprecationWarning:aiohttp.*
